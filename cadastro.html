<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h1>Cadastro</h1>
    <form id="cadastroForm">
      <input type="text" id="nome" placeholder="Nome completo">
      <input type="email" id="email" placeholder="E-mail">
      <input type="text" id="novoUsuario" placeholder="Usuário">
      <input type="password" id="novaSenha" placeholder="Senha">
      <input type="password" id="confirmarSenha" placeholder="Confirmar senha">
      <button type="submit">Cadastrar</button>
      <p id="mensagem"></p>
    </form>
    <p class="link-login">Já tem conta? <a href="index.html">Fazer login</a></p>
  </div>

  <script>
    const form = document.getElementById("cadastroForm");
    const nome = document.getElementById("nome");
    const email = document.getElementById("email");
    const novoUsuario = document.getElementById("novoUsuario");
    const novaSenha = document.getElementById("novaSenha");
    const confirmarSenha = document.getElementById("confirmarSenha");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      if (nome.value === "" || email.value === "" || novoUsuario.value === "" ||
          novaSenha.value === "" || confirmarSenha.value === "") {
        mensagem.style.color = "#ff5252";
        mensagem.textContent = "Preencha todos os campos!";
      } else if (novaSenha.value !== confirmarSenha.value) {
        mensagem.style.color = "#ff5252";
        mensagem.textContent = "As senhas não coincidem.";
      } else {
        mensagem.style.color = "#03dac6";
        mensagem.textContent = "Cadastro realizado com sucesso!";
        form.reset();
      }
    });
  </script>
</body>
</html>
